name: Release

# Build installers for all three desktop platforms and publish them to a
# GitHub Release whenever a v* tag is pushed (e.g. `git push origin v1.0.0`).
# Can also be run manually from the Actions tab against any branch/tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # required to create the Release and upload assets

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci
        # GitHub-hosted runners reach the default Electron CDN fine; the repo's
        # .npmrc mirror still resolves, so no override is needed.

      - name: Type check
        run: npm run typecheck

      - name: Build installers (${{ matrix.platform }})
        run: npm run dist:${{ matrix.platform }}
        env:
          # electron-builder reads this to attach assets to the release.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip code signing — no certs in CI. macOS/Windows produce unsigned
          # artifacts (users may need to bypass Gatekeeper / SmartScreen).
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
            apps/desktop/dist/latest*.yml
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/latest*.yml
          fail_on_unmatched_files: false
          draft: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts (fallback / manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: outline-desktop-${{ matrix.platform }}
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: ignore
