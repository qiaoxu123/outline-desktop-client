name: CI

# Fast checks on every push and PR to main — typecheck + renderer/main build.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install official web dependencies
        working-directory: vendor/outline-web
        run: corepack yarn install --immutable

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build
